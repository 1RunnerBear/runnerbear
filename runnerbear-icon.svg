<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a1e"/>
      <stop offset="0.5" stop-color="#050607"/>
      <stop offset="1" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#f1f2f3"/>
      <stop offset="0.62" stop-color="#c9cdd1"/>
      <stop offset="1" stop-color="#8f969c"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="0.65" stop-color="#cfd3d7"/>
      <stop offset="1" stop-color="#747b81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="17" y="17" width="990" height="990" rx="207" fill="none" stroke="#2b3035" stroke-width="10" opacity="0.75"/>

  <g fill="url(#silver)" filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif" font-weight="900">
    <text x="112" y="704" font-size="520" letter-spacing="-62">RB</text>
  </g>

  <!-- Clean diagonal speed cut: the only running/motion cue -->
  <path d="M420 702 L552 514 L602 514 L470 702 Z" fill="#07090b"/>
  <path d="M457 703 L575 537 L604 537 L487 703 Z" fill="url(#slash)" filter="url(#shadow)"/>
</svg>