name: Enable RunnerBear v5.12 PIN guard

on:
  push:
    paths:
      - '.github/workflows/enable-runnerbear-v512.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PIN guard syntax
        run: node --check runnerbear-v5-11.js
      - name: Wire PIN guard as final script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          line='<script src="runnerbear-v5-11.js?v=12"></script>'
          anchor='<script src="runnerbear-v5-10-restore.js?v=11"></script>'
          if line not in s:
              if anchor not in s:
                  raise SystemExit('Expected restore anchor not found')
              s=s.replace(anchor, anchor+'\n'+line)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-runnerbear-v512.yml
          git add index.html
          git commit -m "Enable PIN guard for RunnerBear data reset"
          git push
