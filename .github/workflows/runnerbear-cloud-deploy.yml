name: RunnerBear Cloud deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloud/runnerbear-cloud/deploy-trigger.txt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloud/runnerbear-cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install

      - name: Validate Worker syntax
        id: validate
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node --check src/index.js

      - name: Deploy and provision D1
        id: deploy_cloud
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: npx wrangler deploy

      - name: Apply D1 migrations
        id: migrate
        if: steps.deploy_cloud.outcome == 'success'
        continue-on-error: true
        run: npx wrangler d1 migrations apply DB --remote

      - name: Smoke test D1 schema
        id: smoke
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        run: npx wrangler d1 execute DB --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name='rb_users'" --json

      - name: Smoke test Worker health
        id: health
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 1 https://runnerbear-cloud.torbjorn-forre.workers.dev/health)"
          echo "$BODY"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true) process.exit(1)' "$BODY"

      - name: Write deploy report
        if: always()
        working-directory: .
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_cloud.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, datetime
          outcomes = {
            "install": os.environ.get("INSTALL_OUTCOME", ""),
            "validate": os.environ.get("VALIDATE_OUTCOME", ""),
            "deploy": os.environ.get("DEPLOY_OUTCOME", ""),
            "migrate": os.environ.get("MIGRATE_OUTCOME", ""),
            "smoke": os.environ.get("SMOKE_OUTCOME", ""),
            "health": os.environ.get("HEALTH_OUTCOME", ""),
          }
          report = {
            "build": "9.8.0",
            "status": "success" if outcomes["smoke"] == "success" and outcomes["health"] == "success" else "failed",
            "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "run_id": os.environ.get("RUN_ID"),
            "source_sha": os.environ.get("SHA"),
            "steps": outcomes,
          }
          with open("cloud/runnerbear-cloud/deploy-status.json", "w", encoding="utf-8") as f:
            json.dump(report, f, indent=2)
            f.write("\n")
          PY
          git config user.name "runnerbear-cloud-bot"
          git config user.email "runnerbear-cloud-bot@users.noreply.github.com"
          git add cloud/runnerbear-cloud/deploy-status.json
          git commit -m "Record RunnerBear Cloud deploy status" || true
          git push

      - name: Fail workflow when cloud deploy failed
        if: always() && steps.health.outcome != 'success'
        run: exit 1
