name: RunnerBear Cloud deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloud/runnerbear-cloud/deploy-trigger.txt

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloud/runnerbear-cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Worker syntax
        run: node --check src/index.js

      - name: Deploy and provision D1
        run: npx wrangler deploy -y

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Smoke test D1 schema
        run: npx wrangler d1 execute DB --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name='rb_users'" --json
