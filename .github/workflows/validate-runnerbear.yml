name: Validate RunnerBear UI

on:
  push:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'site.webmanifest'
      - '_headers'
      - 'scripts/build-v1031.mjs'
      - 'scripts/v1027-history-recovery.mjs'
      - 'runnerbear-v1031-assets.json'
      - 'cloud/runnerbear-cloud/**'
      - 'cloudflare/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/runnerbear-cloud-deploy.yml'
      - '.github/workflows/runnerbear-coach-loop-rollout.yml'
      - '.github/workflows/validate-runnerbear.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'site.webmanifest'
      - '_headers'
      - 'scripts/build-v1031.mjs'
      - 'scripts/v1027-history-recovery.mjs'
      - 'runnerbear-v1031-assets.json'
      - 'cloud/runnerbear-cloud/**'
      - 'cloudflare/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/runnerbear-cloud-deploy.yml'
      - '.github/workflows/runnerbear-coach-loop-rollout.yml'
      - '.github/workflows/validate-runnerbear.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build canonical v10.31 assets
        run: |
          node scripts/build-v1031.mjs
          git diff --exit-code -- runnerbear-core-v1031.js runnerbear-ui-v1031.js runnerbear-data-v1031.js runnerbear-v1031.css

      - name: Check JavaScript loaded by index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', html, flags=re.I)
          scripts = []
          for ref in refs:
              ref = ref.split('?', 1)[0].split('#', 1)[0]
              if not ref or ref.startswith(('http://', 'https://')):
                  continue
              path = Path(ref.lstrip('/'))
              if not path.exists():
                  raise SystemExit(f'Missing script referenced by index.html: {path}')
              if path.suffix == '.js' and path not in scripts:
                  scripts.append(path)

          if not scripts:
              raise SystemExit('No local JavaScript files found in index.html')

          for path in scripts:
              print(f'node --check {path}')
              subprocess.run(['node', '--check', str(path)], check=True)

          print(f'Validated syntax for {len(scripts)} JavaScript files loaded by index.html.')
          PY

      - name: Check HTML ids and local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          dupes = sorted({x for x in ids if ids.count(x) > 1})
          if dupes:
              raise SystemExit('Duplicate HTML ids: ' + ', '.join(dupes))

          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          local = []
          for ref in refs:
              ref = ref.split('?',1)[0].split('#',1)[0]
              if not ref or ref.startswith(('http://','https://','mailto:','#')):
                  continue
              local.append(ref.lstrip('/'))
          missing = sorted({p for p in local if not Path(p).exists()})
          if missing:
              raise SystemExit('Missing local assets referenced by index.html: ' + ', '.join(missing))

          code_assets = [p for p in local if p.endswith(('.js','.css'))]
          duplicate_assets = sorted({p for p in code_assets if code_assets.count(p) > 1})
          if duplicate_assets:
              raise SystemExit('Duplicate JS/CSS references: ' + ', '.join(duplicate_assets))

          print(f'Validated {len(ids)} unique ids and {len(local)} local asset references.')
          PY

      - name: Test structured Tredict workout compiler
        run: node --test tests/tredict-outbound.test.cjs

      - name: Test v10.12 trust and analysis safeguards
        run: node --test tests/v1011-trust.test.cjs tests/v1012-analysis.test.cjs tests/v1020-coaching-clarity.test.cjs

      - name: Test v10.31 coach loop and all legacy contracts
        run: node --test tests/*.test.cjs tests/e2e/*.spec.mjs

      - name: Validate empty and upgraded local D1 schema
        working-directory: cloud/runnerbear-cloud
        run: |
          npm ci
          npx wrangler d1 migrations apply DB --local
          npx wrangler d1 migrations apply DB --local
          npx wrangler d1 execute DB --local --command="SELECT COUNT(*) AS tables_found FROM sqlite_master WHERE type='table' AND name IN ('rb_users','rb_plan_revisions','rb_coach_decisions','rb_sync_operations')" --json

      - name: Validate web manifest
        run: python -m json.tool site.webmanifest > /dev/null
