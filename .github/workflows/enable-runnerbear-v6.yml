name: Enable RunnerBear v6 premium redesign

on:
  push:
    paths:
      - '.github/workflows/enable-runnerbear-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify premium module
        run: node --check runnerbear-premium-v13.js
      - name: Wire Proposal 2 design into live app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<meta name="theme-color" content="#080c11">','<meta name="theme-color" content="#F7F8F6">')
          s=s.replace('<link rel="icon" type="image/svg+xml" href="runnerbear-icon.svg?v=4">','<link rel="icon" type="image/svg+xml" href="runnerbear-brand-mark-flat.svg?v=13">')
          s=s.replace('<link rel="manifest" href="site.webmanifest?v=4">','<link rel="manifest" href="site.webmanifest?v=13">')
          s=s.replace('<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">','<meta name="apple-mobile-web-app-status-bar-style" content="default">')

          css='<link rel="stylesheet" href="runnerbear-premium-v13.css?v=13">'
          css_anchor='<link rel="stylesheet" href="runnerbear-v5-9.css?v=10">'
          if css not in s:
              if css_anchor not in s: raise SystemExit('CSS anchor missing')
              s=s.replace(css_anchor, css_anchor+'\n'+css)

          js='<script src="runnerbear-premium-v13.js?v=13"></script>'
          js_anchor='<script src="runnerbear-v5-11.js?v=12"></script>'
          if js not in s:
              if js_anchor not in s: raise SystemExit('JS anchor missing')
              s=s.replace(js_anchor, js_anchor+'\n'+js)

          if s.count('runnerbear-premium-v13.css') != 1: raise SystemExit('Premium CSS reference count invalid')
          if s.count('runnerbear-premium-v13.js') != 1: raise SystemExit('Premium JS reference count invalid')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit live wiring and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-runnerbear-v6.yml
          git add index.html
          git commit -m "Enable RunnerBear v6 Proposal 2 redesign"
          git push
