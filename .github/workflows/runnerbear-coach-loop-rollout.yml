name: RunnerBear Coach Loop rollout

on:
  workflow_run:
    workflows:
      - RunnerBear Cloud deploy
    types:
      - completed
  schedule:
    # 11:17 UTC lets the seventh-day run occur after the initial production
    # activation timestamp instead of delaying safe-auto until day eight.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: Locked rollout or rollback phase
        required: true
        default: advance
        type: choice
        options:
          - advance
          - safe-auto
          - rollback-safe-auto
          - rollback-sync
          - rollback-write
          - rollback-ui
          - rollback-full

permissions:
  contents: read

concurrency:
  group: runnerbear-coach-loop-production-rollout
  cancel-in-progress: false

jobs:
  rollout:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNNERBEAR_APP_URL: https://app.runnerbear.workers.dev
      REQUESTED_PHASE: ${{ inputs.phase || 'advance' }}
    defaults:
      run:
        working-directory: cloud/runnerbear-cloud
    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release dependencies
        run: npm ci

      - name: Run locked migration, undo, sync, mobile and accessibility gates
        working-directory: .
        run: |
          node scripts/build-v11.mjs
          git diff --exit-code -- runnerbear-core-v11.js runnerbear-ui-v11.js runnerbear-data-v11.js runnerbear-v11.css
          node --test tests/*.test.cjs tests/e2e/*.spec.mjs

      - name: Apply additive rollout audit migration
        run: |
          npx wrangler d1 list --json > /tmp/runnerbear-d1.json
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('/tmp/runnerbear-d1.json').read_text(encoding='utf-8'))
          rows = raw if isinstance(raw, list) else raw.get('result', raw.get('databases', []))
          rows = [row for row in rows if isinstance(row, dict) and (row.get('uuid') or row.get('id'))]
          preferred = [row for row in rows if str(row.get('name', '')).lower() == 'app-db']
          selected = preferred[0] if len(preferred) == 1 else rows[0] if len(rows) == 1 else None
          if selected is None:
              names = ', '.join(sorted(str(row.get('name', '<unnamed>')) for row in rows))
              raise SystemExit(f'Could not resolve production D1 safely. Found: {names or "none"}')
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          config['d1_databases'][0]['database_id'] = selected.get('uuid') or selected.get('id')
          config['d1_databases'][0]['database_name'] = selected.get('name') or 'app-db'
          Path('wrangler.release.jsonc').write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')
          PY
          npx wrangler d1 migrations apply DB --remote --config wrangler.release.jsonc

      - name: Advance locked rollout or execute rollback
        run: |
          case "$REQUESTED_PHASE" in
            rollback-*) node scripts/coach-loop-rollout.mjs rollback "${REQUESTED_PHASE#rollback-}" ;;
            safe-auto) node scripts/coach-loop-rollout.mjs safe-auto ;;
            *) node scripts/coach-loop-rollout.mjs advance ;;
          esac

      - name: Wait for canonical Tredict queue to drain
        if: env.REQUESTED_PHASE == 'advance'
        run: |
          for attempt in $(seq 1 96); do
            BODY="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$RUNNERBEAR_APP_URL/health")"
            echo "sync-drain attempt=$attempt"
            if node ../../scripts/verify-v116-health.mjs "$BODY"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Re-audit rollout after Tredict reconciliation
        if: env.REQUESTED_PHASE == 'advance'
        run: node scripts/coach-loop-rollout.mjs safe-auto

      - name: Verify one confirmed Tredict binding per canonical workout
        if: env.REQUESTED_PHASE == 'advance'
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.release.jsonc --command="WITH active AS (SELECT plan_revision_id FROM rb_plan_revisions WHERE user_id='primary' AND status='active'), desired AS (SELECT i.workout_id,i.local_date FROM rb_plan_revision_items i JOIN active a ON a.plan_revision_id=i.plan_revision_id WHERE i.status='scheduled' AND i.sport='running' AND i.local_date BETWEEN date('now') AND date('now','+13 days')) SELECT (SELECT COUNT(*) FROM desired d WHERE NOT EXISTS (SELECT 1 FROM rb_sync_bindings b JOIN active a ON a.plan_revision_id=b.active_plan_revision_id WHERE b.user_id='primary' AND b.destination='tredict' AND b.workout_id=d.workout_id AND b.status='confirmed' AND b.sync_status='confirmed' AND b.remote_workout_id IS NOT NULL AND b.remote_workout_id<>'' AND b.remote_date=d.local_date)) AS missing_bindings,(SELECT COUNT(*) FROM (SELECT b.remote_workout_id FROM rb_sync_bindings b JOIN desired d ON d.workout_id=b.workout_id JOIN active a ON a.plan_revision_id=b.active_plan_revision_id WHERE b.user_id='primary' AND b.destination='tredict' AND b.status='confirmed' AND b.sync_status='confirmed' AND b.remote_workout_id IS NOT NULL AND b.remote_workout_id<>'' GROUP BY b.remote_workout_id HAVING COUNT(*)>1)) AS duplicate_remote_bindings,(SELECT COUNT(*) FROM rb_sync_operations o JOIN desired d ON d.workout_id=o.workout_id JOIN active a ON a.plan_revision_id=o.plan_revision_id WHERE o.user_id='primary' AND o.status IN ('queued','processing','failed_retryable','failed_terminal','review_required')) AS unresolved_operations" --json > /tmp/runnerbear-canonical-bindings.json
          cat /tmp/runnerbear-canonical-bindings.json
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")),r=x.flatMap(v=>v.results||[])[0]||{};for(const key of ["missing_bindings","duplicate_remote_bindings","unresolved_operations"])if(Number(r[key]||0)!==0)throw new Error(`Canonical Tredict gate failed: ${key}=${r[key]}`)' /tmp/runnerbear-canonical-bindings.json

      - name: Verify production health and Access guard
        run: |
          BODY="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$RUNNERBEAR_APP_URL/health")"
          echo "$BODY"
          node ../../scripts/verify-v116-health.mjs "$BODY"
          RETIRED_CODE="$(curl --silent --output /tmp/runnerbear-retired-coach-live.json --write-out '%{http_code}' "$RUNNERBEAR_APP_URL/api/v2/coach-live")"
          echo "Coach Live HTTP $RETIRED_CODE"
          case "$RETIRED_CODE" in
            410)
              node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.code!=="COACH_LIVE_REMOVED"||x.replacement!=="contextual-coach-1")process.exit(1)' /tmp/runnerbear-retired-coach-live.json
              ;;
            301|302|303|307|308|401|403)
              echo 'Cloudflare Access blocks the retired private route; the health contract proves chat, routes and inference are disabled.'
              ;;
            *)
              echo 'Retired Coach Live route unexpectedly remained reachable.'
              exit 1
              ;;
          esac
          CODE="$(curl --silent --output /tmp/runnerbear-root --write-out '%{http_code}' "$RUNNERBEAR_APP_URL/")"
          echo "RunnerBear root HTTP $CODE"
          case "$CODE" in
            301|302|303|307|308|401|403) exit 0 ;;
            *) echo 'Private Access guard is not active'; exit 1 ;;
          esac
