name: Deploy RunnerBear Tredict Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare/runnerbear-tredict-worker.js"
      - "cloudflare/runnerbear-tredict-worker.mjs"
      - "cloudflare/runnerbear-tredict-worker-v983.mjs"
      - "wrangler.toml"
      - "wrangler.bridge.jsonc"
      - ".github/workflows/deploy-tredict-bridge.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.toml
          secrets: |
            TREDICT_TOKEN
            RUNNERBEAR_BRIDGE_KEY
        env:
          TREDICT_TOKEN: ${{ secrets.TREDICT_TOKEN }}
          RUNNERBEAR_BRIDGE_KEY: ${{ secrets.RUNNERBEAR_BRIDGE_KEY }}

      - name: Verify live bridge and Tredict read
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          RUNNERBEAR_BRIDGE_KEY: ${{ secrets.RUNNERBEAR_BRIDGE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Origin: https://1runnerbear.github.io" \
            -H "X-RunnerBear-Key: ${RUNNERBEAR_BRIDGE_KEY}" \
            "${DEPLOYMENT_URL}/health" > /tmp/health.json
          curl --fail --silent --show-error \
            -H "Origin: https://1runnerbear.github.io" \
            -H "X-RunnerBear-Key: ${RUNNERBEAR_BRIDGE_KEY}" \
            "${DEPLOYMENT_URL}/api/snapshot?days=7" > /tmp/snapshot.json
          python - <<'PY'
          import json
          health=json.load(open('/tmp/health.json',encoding='utf-8'))
          snap=json.load(open('/tmp/snapshot.json',encoding='utf-8'))
          if health.get('ok') is not True: raise SystemExit('Bridge health failed')
          if snap.get('ok') is not True: raise SystemExit('Tredict snapshot failed')
          if not (snap.get('activities') or []): raise SystemExit('No recent activities returned')
          print(f"Bridge + Tredict OK · {len(snap.get('activities') or [])} activities")
          PY

      - name: Verify private migration relay
        id: migration_relay
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          RUNNERBEAR_BRIDGE_KEY: ${{ secrets.RUNNERBEAR_BRIDGE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Origin: https://1runnerbear.github.io" \
            -H "X-RunnerBear-Key: ${RUNNERBEAR_BRIDGE_KEY}" \
            "${DEPLOYMENT_URL}/api/migrate-check" > /tmp/migration-check.json
          cat /tmp/migration-check.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/migration-check.json',encoding='utf-8'))
          if x.get('ok') is not True: raise SystemExit('Migration relay not ready')
          if x.get('cloudVersion') != '9.8.3': raise SystemExit(f"Unexpected migration service version: {x.get('cloudVersion')}")
          PY

      - name: Write bridge deploy report
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration_relay.outcome }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,datetime
          steps={
            'deploy':os.environ.get('DEPLOY_OUTCOME',''),
            'bridge':os.environ.get('VERIFY_OUTCOME',''),
            'migration_relay':os.environ.get('MIGRATION_OUTCOME',''),
          }
          report={
            'build':'9.8.3',
            'status':'success' if all(v=='success' for v in steps.values()) else 'failed',
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'run_id':os.environ.get('RUN_ID'),
            'source_sha':os.environ.get('SHA'),
            'steps':steps,
          }
          with open('cloudflare/bridge-deploy-status.json','w',encoding='utf-8') as f:
            json.dump(report,f,indent=2);f.write('\n')
          PY
          git config user.name "runnerbear-bridge-bot"
          git config user.email "runnerbear-bridge-bot@users.noreply.github.com"
          git add cloudflare/bridge-deploy-status.json
          git commit -m "Record RunnerBear bridge deploy status" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when migration relay is unavailable
        if: always() && (steps.deploy.outcome != 'success' || steps.verify.outcome != 'success' || steps.migration_relay.outcome != 'success')
        run: exit 1
