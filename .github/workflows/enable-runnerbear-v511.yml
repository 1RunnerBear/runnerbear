name: Enable RunnerBear v5.11 Backup

on:
  push:
    paths:
      - '.github/workflows/enable-runnerbear-v511.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire backup modules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="runnerbear-v5-9.js?v=10"></script>'
          add='''<script src="runnerbear-v5-10.js?v=11"></script>\n<script src="runnerbear-v5-10-restore.js?v=11"></script>'''
          if 'runnerbear-v5-10.js?v=11' not in s:
              if anchor not in s:
                  raise SystemExit('Expected v5.10 anchor not found')
              s=s.replace(anchor,anchor+'\n'+add)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify backup JavaScript
        run: |
          node --check runnerbear-v5-10.js
          node --check runnerbear-v5-10-restore.js
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/enable-runnerbear-v511.yml
          git commit -m "Enable RunnerBear v5.11 backup and restore"
          git push
