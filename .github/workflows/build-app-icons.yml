name: Build RunnerBear app icons

on:
  push:
    paths:
      - runnerbear-icon.svg
      - runnerbear-v5-4.js
      - runnerbear-v5-5.js
      - .github/workflows/build-app-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RunnerBear JavaScript
        run: |
          node --check plan.js
          node --check runnerbear-v5-1.js
          node --check runnerbear-v5-2.js
          node --check runnerbear-v5-3.js
          node --check runnerbear-v5-4.js
          node --check runnerbear-v5-5.js
      - name: Install renderer
        run: python -m pip install --quiet cairosvg pillow
      - name: Render icon sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, re
          from PIL import Image
          import cairosvg

          svg_path = Path('runnerbear-icon.svg')
          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'data:image/(?:jpeg|jpg|png);base64,([^\"]+)', svg)

          if match:
              raw = base64.b64decode(match.group(1))
              source = Image.open(io.BytesIO(raw)).convert('RGB')
              for size in (32, 180, 192, 512):
                  icon = source.resize((size, size), Image.Resampling.LANCZOS)
                  icon.save(f'rb-icon-{size}.png', format='PNG', optimize=True)
          else:
              for size in (32, 180, 192, 512):
                  cairosvg.svg2png(url='runnerbear-icon.svg', write_to=f'rb-icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Refresh updated UI asset cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'runnerbear-v5-4\.js(?:\?v=[^\"]+)?', 'runnerbear-v5-4.js?v=6', s)
          s=re.sub(r'runnerbear-v5-5\.js(?:\?v=[^\"]+)?', 'runnerbear-v5-5.js?v=6', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rb-icon-32.png rb-icon-180.png rb-icon-192.png rb-icon-512.png index.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate RunnerBear assets"
            git push
          fi
