name: Build RunnerBear app icons

on:
  push:
    paths:
      - runnerbear-icon.svg
      - .github/workflows/build-app-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install --quiet cairosvg pillow
      - name: Render icon sizes
        run: |
          python - <<'PY'
          import cairosvg
          for size in (32, 180, 192, 512):
              cairosvg.svg2png(url='runnerbear-icon.svg', write_to=f'rb-icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rb-icon-32.png rb-icon-180.png rb-icon-192.png rb-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate RunnerBear app icons"
            git push
          fi
